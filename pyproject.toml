[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qprotsim"
dynamic = ["version"]

authors = [
  { name="Dr Bhushan Bonde", email="b.bonde@uos.ac.uk" },
  { name="Pratik Patil", email="p.patil@uos.ac.uk" }
]
maintainers = [
   { name="Dr Bhushan Bonde", email="b.bonde@uos.ac.uk" },
   { name="Pratik Patil", email="p.patil@uos.ac.uk" }
]

description = "QprotSim: Modelling Protein Dynamics with Quantum Computing"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "qprotsim.__version__"}

[project.urls]
Homepage = "https://github.com/pra-ashok/QProtSim"
Issues = "https://github.com/pra-ashok/QProtSim/issues"
