# Configuration for 1L2Y (Trp-Cage Miniprotein) Analysis
# =========================================================
# This config demonstrates end-to-end analysis using PDB code auto-download

# Protein Identification
pdb_path: ./input/1L2Y.pdb
# pdb_code: 1L2Y
molecule_name: Trp Cage

# Download Settings (used when pdb_code is specified)
# download_dir: ./inputs
# force_download: false      # Set true to re-download even if file exists
# verify_checksum: true      # Verify file integrity after download

# Analysis Parameters
chain: A                   # Protein chain to analyze
protein_only: true         # Exclude non-protein residues (water, ions, etc.)

# Quantum Simulation Settings
shots: 100000              # Number of quantum measurements (more = better statistics)
pl_device: default.qubit    # PennyLane device: 'default.qubit' (CPU), 'lightning.gpu' (GPU)

# Visualization
bins: 10000                 # Number of bins for energy histograms

# Make the open phi_cap as pi/2 and discount to 0.95
# Output Settings
output_dir: ./outputs/1l2y
report_file_name: 1l2y_report_A_v1.pdf
