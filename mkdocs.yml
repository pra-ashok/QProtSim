site_name: QProtSim
site_url: !ENV [DOCS_SITE_URL, "https://pra-ashok.github.io/QProtSim/"]
site_description: Explore protein residue states, energy patterns, and statistical relationships with a quantum-circuit model
repo_url: https://github.com/pra-ashok/QProtSim
repo_name: pra-ashok/QProtSim
edit_uri: ""
copyright: >-
  QProtSim · Authors: <a href="https://pra-ashok.github.io/CV/">Pratik Patil</a>,
  <a href="https://scholar.google.com/citations?hl=en&amp;user=O3hkOEUAAAAJ">Bhushan Bonde</a>, and
  <a href="https://scholar.google.com/citations?user=b88L0aEAAAAJ&amp;hl=en">Bhaskar Choubey</a>
  · Software under the MIT License
strict: true
exclude_docs: |
  /development.md
  /assets/diagrams/*.py
  **/__pycache__/**
  **/*.pyc

theme:
  name: shadcn
  custom_dir: overrides
  icon: assets/branding/qprotsim-logo.png
  favicon: assets/branding/qprotsim-logo.png
  locale: en
  topbar_sections: false
  show_title: true
  show_stargazers: false
  show_datetime: false
  hide_source_files: true
  pygments_style:
    light: shadcn-light
    dark: github-dark
  katex_options:
    strict: warn

nav:
  - Overview: index.md
  - Getting started:
      - Key concepts: concepts.md
      - Installation: installation.md
      - First analysis: getting-started.md
  - User guide:
      - Configuration: configuration.md
      - Outputs and interpretation: outputs.md
      - Troubleshooting: troubleshooting.md
  - Science:
      - Scientific model: theory.md
      - Paper and citation: paper.md
  - Advanced use:
      - Python API: api.md

plugins:
  - shadcn/search

hooks:
  - hooks/docs.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - codehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      css_class: codehilite
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
